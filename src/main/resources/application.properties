# ================== Aplicação ==================
spring.application.name=sistema_restaurante_db
server.port=8080

# ================== Banco de dados (PostgreSQL) ==================
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_restaurante_db?useSSL=false&ServerTimeZone=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ================== JPA / Hibernate ==================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================== Thymeleaf ==================
spring.thymeleaf.cache=false

# ================== Administrador inicial (seed automático) ==================
# Usados apenas na primeira execução, se nenhum administrador existir
# ainda no banco. Troque a senha padrão em qualquer ambiente real.
admin.email=admin@restaurante.com
admin.senha-inicial=Admin@123
